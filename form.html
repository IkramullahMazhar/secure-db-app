<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Your Data</title>
    <style>
        /* I use CSS variables so I can change the colour theme in one place */
        :root {
            --bg: #e3f2fd;
            --card-bg: #ffffff;
            --primary: #4fc3f7;
            --primary-dark: #0288d1;
            --accent: #a5d6a7;
            --accent-soft: #e8f5e9;
            --text-main: #1f2933;
            --text-muted: #607d8b;
            --error: #e53935;
            --success: #2e7d32;
            --border: #cfd8dc;
        }

        /* Simple reset and shared font choice */
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Full-page background and centering the form card */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #b3e5fc, var(--bg));
        }

        /* Main form container with soft shadow and rounded corners */
        .form-wrapper {
            background: linear-gradient(135deg, #ffffff, #f1f8ff);
            padding: 32px 40px;
            border-radius: 16px;
            box-shadow: 0 18px 35px rgba(15, 23, 42, 0.18);
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(144, 202, 249, 0.6);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.7rem;
            color: var(--text-main);
        }

        /* Short description under the heading */
        .subtitle {
            margin: 0 0 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Wrap each label + input + error together */
        .field-group {
            margin-bottom: 16px;
        }

        /* Label row shows the field name and a small hint on the right */
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.93rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        label span.hint {
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Basic styling for all text inputs */
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* Highlight input when user is typing */
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
            background-color: #ffffff;
        }

        /* Area where I show field-specific error messages */
        .error {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 3px;
            min-height: 16px;
        }

        /* General form message line (success or server feedback) */
        #formMessage {
            margin-top: 12px;
            font-size: 0.9rem;
            min-height: 18px;
        }

        .success {
            color: var(--success);
        }

        /* Horizontal row for submit button and the small badge */
        .btn-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        /* Main submit button style */
        button[type="submit"] {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            box-shadow: 0 10px 18px rgba(2, 136, 209, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        /* Small hover / click animation to make it feel interactive */
        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(2, 136, 209, 0.4);
            background: linear-gradient(135deg, var(--primary-dark), #01579b);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 8px 14px rgba(2, 136, 209, 0.35);
        }

        /* Little pill badge showing that data is secure/validated */
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            background: linear-gradient(135deg, var(--accent-soft), #e3fdf3);
            color: #2e7d32;
            border: 1px solid rgba(165, 214, 167, 0.9);
        }

        /* Info box under the form with a short tip for the user */
        .pill-footer {
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(224, 247, 250, 0.9), rgba(232, 245, 233, 0.9));
            border: 1px solid rgba(178, 235, 242, 0.7);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .pill-footer strong {
            color: var(--primary-dark);
        }

        /* On smaller screens I reduce padding so it fits nicely */
        @media (max-width: 540px) {
            .form-wrapper {
                margin: 24px;
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
<div class="form-wrapper">
    <h1>Submit Your Data</h1>
    <p class="subtitle">Please fill in your details below. All fields are required.</p>

    <!-- Main HTML form that posts data to my Express route /submit -->
    <form id="userForm" method="post" action="/submit" novalidate>
        <div class="field-group">
            <label for="firstName">
                First Name
                <span class="hint">Max 20 chars</span>
            </label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name">
            <div id="firstNameError" class="error"></div>
        </div>

        <div class="field-group">
            <label for="secondName">
                Second Name
                <span class="hint">Max 20 chars</span>
            </label>
            <input type="text" id="secondName" name="secondName" autocomplete="family-name">
            <div id="secondNameError" class="error"></div>
        </div>

        <div class="field-group">
            <label for="email">
                Email
                <span class="hint">example@domain.com</span>
            </label>
            <input type="text" id="email" name="email" autocomplete="email">
            <div id="emailError" class="error"></div>
        </div>

        <div class="field-group">
            <label for="phone">
                Phone
                <span class="hint">10 digits</span>
            </label>
            <input type="text" id="phone" name="phone" autocomplete="tel">
            <div id="phoneError" class="error"></div>
        </div>

        <div class="field-group">
            <label for="eircode">
                Eircode
                <span class="hint">6 chars, start with number</span>
            </label>
            <input type="text" id="eircode" name="eircode">
            <div id="eircodeError" class="error"></div>
        </div>

        <div class="btn-row">
            <button type="submit">Save details</button>
            <span class="badge">Secure • Validated</span>
        </div>

        <div id="formMessage"></div>

        <div class="pill-footer">
            <span><strong>Tip:</strong> Use only letters and numbers in your name and Eircode.</span>
        </div>
    </form>
</div>

<script>
    // Grab the form so I can attach my submit handler
    const form = document.getElementById('userForm');

    // Small helper functions for the different patterns I need to check
    function isAlphanumeric(str) {
        return /^[a-zA-Z0-9]+$/.test(str);
    }

    function isEmail(str) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    function isNumeric(str) {
        return /^[0-9]+$/.test(str);
    }

    function isValidEircode(str) {
        return /^[0-9][a-zA-Z0-9]{5}$/.test(str);
    }

    // Client-side validation so the user gets instant feedback
    form.addEventListener('submit', function (event) {
        event.preventDefault();

        // Clear all previous errors and messages
        document.getElementById('firstNameError').textContent = '';
        document.getElementById('secondNameError').textContent = '';
        document.getElementById('emailError').textContent = '';
        document.getElementById('phoneError').textContent = '';
        document.getElementById('eircodeError').textContent = '';
        document.getElementById('formMessage').textContent = '';
        document.getElementById('formMessage').className = '';

        let valid = true;

        // Read and trim all current values from the form
        const firstName = document.getElementById('firstName').value.trim();
        const secondName = document.getElementById('secondName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const eircode = document.getElementById('eircode').value.trim();

        // First name validation rules
        if (!firstName) {
            document.getElementById('firstNameError').textContent = 'First name is required.';
            valid = false;
        } else if (!isAlphanumeric(firstName)) {
            document.getElementById('firstNameError').textContent = 'First name must be letters or numbers only.';
            valid = false;
        } else if (firstName.length > 20) {
            document.getElementById('firstNameError').textContent = 'First name must be max 20 characters.';
            valid = false;
        }

        // Second name validation rules
        if (!secondName) {
            document.getElementById('secondNameError').textContent = 'Second name is required.';
            valid = false;
        } else if (!isAlphanumeric(secondName)) {
            document.getElementById('secondNameError').textContent = 'Second name must be letters or numbers only.';
            valid = false;
        } else if (secondName.length > 20) {
            document.getElementById('secondNameError').textContent = 'Second name must be max 20 characters.';
            valid = false;
        }

        // Email validation rules
        if (!email) {
            document.getElementById('emailError').textContent = 'Email is required.';
            valid = false;
        } else if (!isEmail(email)) {
            document.getElementById('emailError').textContent = 'Email must be a valid email format.';
            valid = false;
        }

        // Phone number validation rules
        if (!phone) {
            document.getElementById('phoneError').textContent = 'Phone number is required.';
            valid = false;
        } else if (!isNumeric(phone)) {
            document.getElementById('phoneError').textContent = 'Phone number must contain only numbers.';
            valid = false;
        } else if (phone.length !== 10) {
            document.getElementById('phoneError').textContent = 'Phone number must be exactly 10 digits.';
            valid = false;
        }

        // Eircode validation rules
        if (!eircode) {
            document.getElementById('eircodeError').textContent = 'Eircode is required.';
            valid = false;
        } else if (!isValidEircode(eircode)) {
            document.getElementById('eircodeError').textContent =
                'Eircode must start with a number, be alphanumeric, and exactly 6 characters.';
            valid = false;
        }

        // If anything failed, do not send the request to the server
        if (!valid) {
            return;
        }

        // At this point the data passed client-side checks, so I let the browser submit it
        form.submit();
    });
</script>
</body>
</html>
