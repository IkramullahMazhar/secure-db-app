<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Form</title>
</head>
<body>
    <h1>Submit Your Data</h1>

    <!-- The form sends data to /submit on the server using POST -->
    <form id="userForm" method="post" action="/submit">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required><br><br>

        <label for="secondName">Second Name:</label>
        <input type="text" id="secondName" name="secondName" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" required><br><br>

        <label for="eircode">Eircode:</label>
        <input type="text" id="eircode" name="eircode" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <!-- Simple script just to show the form is submitting on the browser side -->
    <script>
        const form = document.getElementById('userForm');

        form.addEventListener('submit', function (event) {
            console.log('Form is being submitted');
            // We are not preventing default here, so the browser will send the form to /submit
        });
    </script>
</body>
</html>
